<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<title>Candlestick + Fake RSI</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  background:#0b1220;
}
canvas{
  display:block;
  width:100%;
  height:100%;
}
</style>
</head>
<body>

<canvas id="chart"></canvas>

<script>

const canvas = document.getElementById("chart");
const ctx = canvas.getContext("2d");
const DPR = window.devicePixelRatio || 1;

const padding = 40;
const rightPadding = 80;

function resize(){
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * DPR;
  canvas.height = rect.height * DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
}

window.addEventListener("resize",()=>{
  resize();
  draw();
});

resize();

/* =========================
   DATA
========================= */

function generateFakeCandles(count=85,start=42000){
  let price=start;

  return Array.from({length:count},()=>{
    const open=price;
    const close=open+(Math.random()-0.5)*2000;
    const high=Math.max(open,close)+Math.random()*800;
    const low=Math.min(open,close)-Math.random()*800;

    price=close;

    return{open,high,low,close};
  });
}

const data=generateFakeCandles();

/* ===== FAKE RSI ===== */

function generateFakeRSI(count){
  let rsi=50;

  return Array.from({length:count},()=>{
    rsi+= (Math.random()-0.5)*10;
    rsi=Math.max(5,Math.min(95,rsi));
    return rsi;
  });
}

const rsiData = generateFakeRSI(data.length);

/* =========================
   LAYOUT
========================= */

function getPriceAreaHeight(){
  return canvas.height/DPR*0.7;
}

function getRSIAreaTop(){
  return canvas.height/DPR*0.7;
}

function getRSIAreaHeight(){
  return canvas.height/DPR*0.3;
}

/* =========================
   PRICE SCALE
========================= */

const prices = data.flatMap(d=>[d.high,d.low]);
const maxPrice = Math.max(...prices);
const minPrice = Math.min(...prices);

function priceToY(price){

  const h = getPriceAreaHeight();

  return padding +
    (maxPrice-price)/(maxPrice-minPrice) *
    (h-padding*2);
}

/* =========================
   RSI SCALE
========================= */

function rsiToY(v){

  const top = getRSIAreaTop();
  const h = getRSIAreaHeight();

  return top + (100-v)/100 * (h-20) + 10;
}

/* =========================
   DRAW PRICE SCALE
========================= */

function drawPriceScale(){

  const h = getPriceAreaHeight();
  const w = canvas.width/DPR;
  const steps=6;

  ctx.font="12px system-ui";
  ctx.textAlign="right";
  ctx.textBaseline="middle";

  for(let i=0;i<=steps;i++){

    const price = maxPrice - (i/steps)*(maxPrice-minPrice);
    const y = priceToY(price);

    ctx.strokeStyle="rgba(255,255,255,0.06)";
    ctx.beginPath();
    ctx.moveTo(padding,y);
    ctx.lineTo(w-rightPadding,y);
    ctx.stroke();

    ctx.fillStyle="#9aa4b2";
    ctx.fillText(price.toFixed(2),w-10,y);
  }
}

/* =========================
   DRAW RSI
========================= */

function drawRSI(){

  const w = canvas.width/DPR;
  const candleWidth=8;
  const gap=4;

  const chartWidth=w-rightPadding;

  const top=getRSIAreaTop();
  const h=getRSIAreaHeight();

  ctx.strokeStyle="rgba(255,255,255,0.1)";
  ctx.strokeRect(padding,top,chartWidth-padding,h);

  /* 30 / 70 lines */

  [30,70].forEach(level=>{

    const y=rsiToY(level);

    ctx.strokeStyle="rgba(255,255,255,0.2)";
    ctx.beginPath();
    ctx.moveTo(padding,y);
    ctx.lineTo(chartWidth,y);
    ctx.stroke();
  });

  /* RSI line */

  ctx.beginPath();

  rsiData.forEach((v,i)=>{

    const x = padding + i*(candleWidth+gap)+candleWidth/2;
    if(x>chartWidth) return;

    const y=rsiToY(v);

    if(i===0) ctx.moveTo(x,y);
    else ctx.lineTo(x,y);
  });

  ctx.strokeStyle="#fdd835";
  ctx.lineWidth=2;
  ctx.stroke();

}

/* =========================
   DRAW
========================= */

function draw(){

  const w = canvas.width/DPR;
  const h = canvas.height/DPR;

  ctx.clearRect(0,0,w,h);

  const candleWidth=8;
  const gap=4;
  const chartWidth=w-rightPadding;

  data.forEach((c,i)=>{

    const x=padding+i*(candleWidth+gap);
    if(x+candleWidth>chartWidth) return;

    const yO=priceToY(c.open);
    const yC=priceToY(c.close);
    const yH=priceToY(c.high);
    const yL=priceToY(c.low);

    const up=c.close>=c.open;

    ctx.strokeStyle=up?"#26a69a":"#ef5350";
    ctx.fillStyle=up?"#26a69a":"#ef5350";

    ctx.beginPath();
    ctx.moveTo(x+candleWidth/2,yH);
    ctx.lineTo(x+candleWidth/2,yL);
    ctx.stroke();

    ctx.fillRect(
      x,
      Math.min(yO,yC),
      candleWidth,
      Math.abs(yC-yO)||1
    );

  });

  drawPriceScale();
  drawRSI();
}

draw();

</script>
</body>
</html>
