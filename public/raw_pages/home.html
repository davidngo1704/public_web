<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <title>AGI</title>
    <link rel="stylesheet" href="web/common/menu.css">

    <style>
        body {
            margin: 0;
            font-family: system-ui, sans-serif;
            color: #e5e7eb;
            background: #020617;
            /* ĐEN TUYỆT ĐỐI */
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }



        @keyframes bgFlow {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        /* PARTICLES */
        .particle {
            position: fixed;
            width: 6px;
            height: 6px;
            background: rgba(56, 189, 248, 0.35);
            border-radius: 50%;
            animation: floatUp linear infinite;
            pointer-events: none;
        }

        @keyframes floatUp {
            from {
                transform: translateY(100vh) scale(0.5);
                opacity: 0;
            }

            to {
                transform: translateY(-10vh) scale(1.2);
                opacity: 1;
            }
        }

        /* HEADER */
        header {
            position: fixed;
            top: 60px;
            width: 100%;
            min-height: 86px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 18px;
            flex-wrap: wrap;
            background: rgba(2, 6, 23, 0.75);
            backdrop-filter: blur(10px);
            box-shadow: 0 0 40px rgba(56, 189, 248, 0.4);
            z-index: 1000;
            padding: 10px;
        }


        @keyframes float {
            0% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-4px);
            }

            100% {
                transform: translateY(0);
            }
        }

        .price {
            font-weight: 700;
        }

        .green {
            color: #22c55e;
        }

        .red {
            color: #ef4444;
        }

        .tick {
            animation: tick 0.25s ease;
        }

        @keyframes tick {
            from {
                filter: brightness(1.8);
            }

            to {
                filter: brightness(1);
            }
        }
    </style>
</head>

<body>

    <nav id="menuNav">
        <!-- menu sẽ render động -->
    </nav>
    <script src="web/common/menu.js"></script>
    <script>
        setInterval(() => {
            location.reload();
        }, 120 * 1000);
    </script>
</body>

</html>
