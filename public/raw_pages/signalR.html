<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Binance Realtime OHLCV</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.7/signalr.min.js"></script>

<style>

body{
    font-family: Arial;
    background:#0f172a;
    color:#e5e7eb;
}

.container{
    width:700px;
    margin:auto;
    margin-top:40px;
}

h2{
    text-align:center;
}

#messages{
    border:1px solid #334155;
    height:400px;
    overflow:auto;
    padding:10px;
    background:#020617;
    font-family: monospace;
}

.row{
    padding:6px;
    border-bottom:1px solid #1e293b;
}

.symbol{
    color:#38bdf8;
}

.price{
    color:#22c55e;
}

.volume{
    color:#f59e0b;
}

</style>

</head>

<body>

<div class="container">

<h2>Binance Realtime OHLCV</h2>

<div id="messages"></div>

</div>

<script>

const messages = document.getElementById("messages");

const connection = new signalR.HubConnectionBuilder()
    .withUrl("https://localhost:44359/chatHub")
    .withAutomaticReconnect()
    .build();


connection.on("ReceiveKline", function(data){

    const row = document.createElement("div");
    row.className = "row";

    const time = new Date(data.openTime).toLocaleTimeString();

    row.innerHTML =
        `<span class="symbol">${data.symbol}</span>
         | O: <span class="price">${data.open}</span>
         H: <span class="price">${data.high}</span>
         L: <span class="price">${data.low}</span>
         C: <span class="price">${data.close}</span>
         | V: <span class="volume">${data.volume}</span>
         | ${time}
         | closed: ${data.isClosed}`;

    messages.appendChild(row);

    messages.scrollTop = messages.scrollHeight;
});


async function start(){

    try{
        await connection.start();
        console.log("SignalR Connected");
    }
    catch(err){
        console.error(err);
        setTimeout(start, 2000);
    }

}

start();

</script>

</body>
</html>
